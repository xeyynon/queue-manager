name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/contrast.mjs
      - run: npm run build
      # DB + E2E tests need a Neon test branch; they run when the secret exists.
      - name: DB tests
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm run test:db
