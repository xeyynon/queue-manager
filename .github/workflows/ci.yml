name: CI / Deploy

# Every push to main: check → test → migrate production DB → deploy to Vercel.
# Pull requests: check → test only. Deploy runs only when every test passed.
# See MD/deployment.md (DEC-028).

on:
  push:
    branches: [main]
  pull_request:

# DB and E2E tests wipe the shared Neon `test` branch, so runs go one at a time.
concurrency:
  group: queue-manager-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node scripts/contrast.mjs
      - run: npm run build

  test:
    name: DB + end-to-end tests (Neon test branch)
    needs: check
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Require test database secret
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Repository secret TEST_DATABASE_URL is missing"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: DB integration tests
        run: npm run test:db
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone)
        run: |
          # A throwaway auth secret for the test server only.
          export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
          npm run test:e2e
      - name: Keep Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  deploy:
    name: Migrate production DB and deploy to Vercel
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://queue-manager-bice.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Migrations run before the new code goes live; keep them backward-compatible
      # (add columns/tables first, remove in a later release).
      - name: Apply database migrations to Neon main
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx drizzle-kit migrate
      - name: Pull Vercel production settings
        run: npx --yes vercel@60.1.3 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build
        run: npx --yes vercel@60.1.3 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy to production
        run: npx --yes vercel@60.1.3 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Smoke test the live site
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://queue-manager-bice.vercel.app/login)
          echo "GET /login -> $code"
          [ "$code" = "200" ]
